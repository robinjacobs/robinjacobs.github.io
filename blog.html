<head>

    <style>
        /* Blog Specific Styles */
        .blog-post-card {
            padding: 2rem;
            margin-bottom: 3rem;
            border-radius: 12px !important;
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: #fff;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .blog-post-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08) !important;
        }

        .blog-post-card:focus-visible {
            outline: 2px solid #1a1a1a;
            outline-offset: 4px;
        }

        .post-excerpt {
            font-size: 1.05rem;
            color: var(--text-main);
            margin-bottom: 2rem;
        }

        .card-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #f5f5f5;
            padding-top: 1.5rem;
        }

        .card-actions .like-container {
            border-top: none;
            padding-top: 0;
        }

        .read-more {
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: lowercase;
            color: #999;
            white-space: nowrap;
        }

        .read-more i {
            margin-left: 6px;
            transition: transform 0.2s ease;
        }

        .blog-post-card:hover .read-more {
            color: #1a1a1a;
        }

        .blog-post-card:hover .read-more i {
            transform: translateX(3px);
        }

        .post-metadata {
            font-size: 0.85rem;
            text-transform: lowercase;
            color: #999;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .post-content {
            font-size: 1.05rem;
            color: var(--text-main);
            margin-bottom: 2rem;
        }

        /* The "Start" Like Button */
        .like-container {
            display: flex;
            align-items: center;
            border-top: 1px solid #f5f5f5;
            padding-top: 1.5rem;
        }

        .like-button {
            background: #f0f0f0;
            border: none;
            padding: 8px 24px;
            border-radius: 50px;
            color: #1a1a1a;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: lowercase;
            display: flex;
            align-items: center;
        }

        .like-button i {
            margin-right: 8px;
            font-size: 0.9rem;
        }

        .like-button:hover {
            background: #e5e5e5;
            transform: translateY(-1px);
        }

        .like-button.liked {
            background: #1a1a1a;
            color: #fff;
        }

        /* The "Letter" Overlay */
        .post-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .post-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .post-overlay-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 26, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .post-letter {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 880px;
            max-height: 100%;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            transform: translateY(12px) scale(0.99);
            transition: transform 0.25s ease;
        }

        .post-overlay.open .post-letter {
            transform: none;
        }

        .post-letter-scroll {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 2.5rem 3.25rem 1.5rem;
        }

        .post-letter-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 1;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #f0f0f0;
            color: #1a1a1a;
            font-size: 0.9rem;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .post-letter-close:hover {
            background: #e5e5e5;
        }

        .post-letter-title {
            font-weight: 700;
            letter-spacing: -1px;
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
        }

        .post-letter .post-content {
            line-height: 1.75;
        }

        .post-letter .post-content img {
            max-width: 100%;
        }

        .post-letter .post-content pre {
            overflow-x: auto;
            background: #fafafa;
            padding: 1rem;
            border-radius: 6px;
        }

        body.overlay-open {
            overflow: hidden;
        }

        @media (max-width: 576px) {
            .post-overlay {
                padding: 1rem;
            }

            .post-letter-scroll {
                padding: 3rem 1.5rem 2rem;
            }

            .post-letter-title {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <section id="blog-section">
            <div class="blog-header">
                <h1 class="name">\log(flow)</h1>
                <span class="blog-subtitle">Adventures in Embodied Intelligence and Beyond</span>

            <div id="blog-posts">

    <div class="post-overlay" id="post-overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title"
        aria-hidden="true">
        <div class="post-overlay-backdrop" data-close></div>
        <div class="post-letter">
            <button class="post-letter-close" type="button" aria-label="close post" data-close>
                <i class="fas fa-times"></i>
            </button>
            <div class="post-letter-scroll">
                <h2 class="post-letter-title" id="overlay-title"></h2>
                <div class="post-metadata" id="overlay-metadata"></div>
                <div class="post-content" id="overlay-content"></div>
                <div class="like-container">
                    <button class="like-button" id="overlay-like-button">
                        <i class="far fa-heart"></i> like
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="social-icons d-flex justify-content-center fixed-bottom">
        <a href="https://github.com/robinjacobs" target="_blank"><i class="fab fa-github fa-lg"></i></a>

        <a href="blog.html" target="_blank"><i class="fas fa-blog fa-lg"></i></a>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="../assets/applets.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const postsContainer = document.getElementById('blog-posts');
            const overlay = document.getElementById('post-overlay');
            const overlayScroll = overlay.querySelector('.post-letter-scroll');
            const overlayTitle = document.getElementById('overlay-title');
            const overlayMetadata = document.getElementById('overlay-metadata');
            const overlayContent = document.getElementById('overlay-content');
            const overlayLikeButton = document.getElementById('overlay-like-button');

            const cardLikeControls = {};
            let openedPost = null;
            let lastFocused = null;

            // 1. Load Posts (kept in the order listed by posts.json)
            fetch('../posts.json')
                .then(res => res.json())
                .then(files => Promise.all(files.map(postFile =>
                    fetch(`../_posts/${postFile}`)
                        .then(res => res.text())
                        .then(text => parseMarkdown(text, postFile))
                )))
                .then(posts => {
                    posts.forEach(post => postsContainer.appendChild(createPostCard(post)));
                });

            // 2. Navbar Reveal
            window.onscroll = function () {
                const nav = document.getElementById("navbar-ph");
                if (window.pageYOffset > 50) nav.classList.add("visible");
                else nav.classList.remove("visible");
            }

            // 3. Parser
            function parseMarkdown(text, filename) {
                const lines = text.split('\n');
                const meta = {};
                let content = '';
                let inMeta = false;
                if (lines[0]?.trim() === '---') { inMeta = true; lines.shift(); }
                for (let i = 0; i < lines.length; i++) {
                    if (inMeta) {
                        if (lines[i].trim() === '---') inMeta = false;
                        else {
                            const d = lines[i].indexOf(':');
                            if (d !== -1) meta[lines[i].slice(0, d).trim()] = lines[i].slice(d + 1).trim().replace(/^"|"$/g, '');
                        }
                    } else content += lines[i] + '\n';
                }
                return { ...meta, content: content.trim(), slug: filename.replace('.md', '') };
            }

            // 4. Card Creator (preview only, the full post lives in the overlay)
            function createPostCard(post) {
                const card = document.createElement('article');
                card.className = 'card blog-post-card shadow-sm';
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', `read ${post.title || 'Untitled'}`);
                card.innerHTML = `
                    <div class="card-body">
                        <h2 class="card-title" style="font-weight:700; letter-spacing:-0.5px;">${post.title || 'Untitled'}</h2>
                        <div class="post-metadata">By ${post.author || 'Robin Jacobs'} • ${post.date || ''}</div>
                        <p class="post-excerpt"></p>
                        <div class="card-actions">
                            <div class="like-container">
                                <button class="like-button">
                                    <i class="far fa-heart"></i> like
                                </button>
                            </div>
                            <span class="read-more">read post <i class="fas fa-arrow-right"></i></span>
                        </div>
                    </div>`;

                card.querySelector('.post-excerpt').textContent = excerptOf(post);

                const btn = card.querySelector('.like-button');
                cardLikeControls[post.slug] = btn;
                paintLikes(post.slug);

                // Liking must not open the letter
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    toggleLike(post.slug);
                });

                card.addEventListener('click', () => openPost(post, card));
                card.addEventListener('keydown', e => {
                    if (e.target !== card) return; // let the like button handle its own keys
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openPost(post, card);
                    }
                });

                return card;
            }

            // 5. Excerpt (markdown stripped down to plain text, applet blocks dropped)
            function excerptOf(post, maxChars = 220) {
                const prose = post.content.replace(/```applet[\s\S]*?```/g, '');
                const holder = document.createElement('div');
                holder.innerHTML = marked.parse(prose);
                const text = (holder.textContent || '').replace(/\s+/g, ' ').trim();
                return text.length > maxChars ? text.slice(0, maxChars).trimEnd() + '…' : text;
            }

            // 6. Overlay
            function openPost(post, trigger) {
                openedPost = post;
                lastFocused = trigger || null;

                overlayTitle.textContent = post.title || 'Untitled';
                overlayMetadata.textContent = `By ${post.author || 'Robin Jacobs'} • ${post.date || ''}`;
                overlayContent.innerHTML = marked.parse(post.content);
                Applets.mount(overlayContent);
                paintLikes(post.slug);

                // A mobile menu left open would sit behind the letter
                document.getElementById('navbarNav').classList.remove('show');

                const scrollbar = window.innerWidth - document.documentElement.clientWidth;
                if (scrollbar > 0) document.body.style.paddingRight = `${scrollbar}px`;
                document.body.classList.add('overlay-open');

                overlay.classList.add('open');
                overlay.setAttribute('aria-hidden', 'false');
                overlayScroll.scrollTop = 0;
                overlay.querySelector('.post-letter-close').focus();
            }

            function closePost() {
                if (!openedPost) return;
                openedPost = null;
                Applets.unmountAll();
                overlay.classList.remove('open');
                overlay.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('overlay-open');
                document.body.style.paddingRight = '';
                if (lastFocused) lastFocused.focus();
            }

            overlay.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closePost));
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') closePost();
            });
            overlayLikeButton.addEventListener('click', () => {
                if (openedPost) toggleLike(openedPost.slug);
            });

            // 7. Like Logic (card and overlay stay in sync)
            function readLikes(slug) {
                return {
                    isLiked: localStorage.getItem(`hasLiked-${slug}`) === 'true'
                };
            }

            function paintControl(button, slug) {
                const { isLiked } = readLikes(slug);
                button.classList.toggle('liked', isLiked);
                button.querySelector('i').className = isLiked ? 'fas fa-heart' : 'far fa-heart';
            }

            function paintLikes(slug) {
                const button = cardLikeControls[slug];
                if (button) paintControl(button, slug);
                if (openedPost && openedPost.slug === slug) paintControl(overlayLikeButton, slug);
            }

            function toggleLike(slug) {
                const { isLiked } = readLikes(slug);
                localStorage.setItem(`hasLiked-${slug}`, String(!isLiked));
                paintLikes(slug);
            }
        });
    </script>
</body>
